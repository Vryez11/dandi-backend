spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DB}?sslMode=VERIFY_IDENTITY&serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
      max-lifetime: 1200000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: true
      timeout: 1s
      connect-timeout: 1s

  flyway:
    enabled: false

  jpa:
    show-sql: false

  web:
    error:
      include-stacktrace: never
      include-message: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.dandi.nyummy: INFO

management:
  opentelemetry:
    resource-attributes:
      "[deployment.environment.name]": prod
  tracing:
    sampling:
      # 느리거나 실패한 요청의 trace를 놓치지 않도록 전부 샘플링한다.
      # Grafana Cloud Free 한도(trace 월 50GB)를 넘을 것 같으면 낮춘다.
      probability: 1.0
